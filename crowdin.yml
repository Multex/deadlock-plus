project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
preserve_hierarchy: true

files:
  - source: /locales/*/en.json
    translation: /%original_path%/%locale%.json
    type: i18next_json
    ignore:
      - /locales/*/en-XA.json
    # %two_letters_code% is shared by pt and pt-BR, and by zh-CN and zh-TW, so
    # Crowdin refuses to export them. %locale% is unique per language; the
    # mapping shortens it to the file names the app loads.
    languages_mapping:
      locale:
        af: af
        cs: cs
        de: de
        es-ES: es
        fr: fr
        hu: hu
        id: id
        it: it
        ja: ja
        ko: ko
        pl: pl
        pt-PT: pt
        pt-BR: pt-BR
        ru: ru
        th: th
        tr: tr
        uk: uk
        zh-CN: zh-CN
        zh-TW: zh-TW
