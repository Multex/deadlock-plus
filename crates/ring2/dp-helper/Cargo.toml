[package]
name = "dp-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dp]
tier = 2

[dependencies]
dp-connection = { path = "../../ring1/dp-connection" }
dp-elevation = { path = "../../ring1/dp-elevation" }
dp-firewall = { path = "../../ring1/dp-firewall" }
dp-frames = { path = "../../ring1/dp-frames" }
dp-game = { path = "../../ring1/dp-game" }
dp-privilege = { path = "../../ring0/dp-privilege" }
dp-server-picker = { path = "../dp-server-picker" }
log = "0.4.34"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
