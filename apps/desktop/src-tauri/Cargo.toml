[package]
name = "deadlock-plus"
version.workspace = true
description = "Companion app for Deadlock: server picker, connection monitor, mutes, replays and storage"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dp]
tier = 3

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deadlock_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
dp-sync = { path = "../../../crates/ring0/dp-sync" }
dp-text = { path = "../../../crates/ring0/dp-text" }
dp-crash = { path = "../../../crates/ring0/dp-crash" }
dp-atomic = { path = "../../../crates/ring0/dp-atomic" }
dp-versioned = { path = "../../../crates/ring0/dp-versioned" }
dp-export = { path = "../../../crates/ring0/dp-export" }
dp-kv = { path = "../../../crates/ring0/dp-kv" }
dp-game = { path = "../../../crates/ring1/dp-game" }
dp-icmp = { path = "../../../crates/ring1/dp-icmp" }
dp-connection = { path = "../../../crates/ring1/dp-connection" }
dp-elevation = { path = "../../../crates/ring1/dp-elevation" }
dp-discord-ipc = { path = "../../../crates/ring1/dp-discord-ipc" }
dp-live = { path = "../../../crates/ring1/dp-live" }
dp-autostart = { path = "../../../crates/ring1/dp-autostart" }
dp-firewall = { path = "../../../crates/ring1/dp-firewall" }
dp-steam = { path = "../../../crates/ring1/dp-steam" }
dp-frames = { path = "../../../crates/ring1/dp-frames" }
dp-postgame = { path = "../../../crates/ring1/dp-postgame" }
dp-mvp = { path = "../../../crates/ring1/dp-mvp" }
dp-telemetry = { path = "../../../crates/ring1/dp-telemetry" }
dp-storage = { path = "../../../crates/ring2/dp-storage" }
dp-voice-bans = { path = "../../../crates/ring2/dp-voice-bans" }
dp-demos = { path = "../../../crates/ring2/dp-demos" }
dp-ingest = { path = "../../../crates/ring2/dp-ingest" }
dp-presence = { path = "../../../crates/ring2/dp-presence" }
dp-gc = { path = "../../../crates/ring2/dp-gc" }
dp-server-picker = { path = "../../../crates/ring2/dp-server-picker" }
dp-alerts = { path = "../../../crates/ring2/dp-alerts" }
dp-patch-notes = { path = "../../../crates/ring2/dp-patch-notes" }
dp-network = { path = "../../../crates/ring2/dp-network" }
dp-diagnostics = { path = "../../../crates/ring2/dp-diagnostics" }
dp-support = { path = "../../../crates/ring2/dp-support" }
dp-gamedata = { path = "../../../crates/ring2/dp-gamedata" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "brotli"] }
tokio = { version = "1", features = ["process", "sync", "time", "rt"] }
futures = "0.3"
sysinfo = "0.33"
notify = "8"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
log = "0.4.34"
tauri-plugin-log = "2.9.2"
flate2 = "1.1.10"
# Rasterizes the unread-count digits drawn onto the tray/taskbar badge icons.
ab_glyph = "0.2"
time = { version = "0.3", features = ["local-offset"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
ts-rs = "12"
# Dev-only UI automation bridge. Pinned: 0.13.1 requires tauri 2.12.2 or later. Registered in debug builds only.
tauri-plugin-mcp-bridge = "=0.13.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_Foundation", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
ferrisetw = "1.2.0"
# Matches the version tauri itself depends on, so `WebviewWindow::window_handle()` (raw-window-handle)
# hands back a type we can use directly, instead of pulling in a second, incompatible semver line.
raw-window-handle = "0.6"
# Both match the versions tauri's WebView2 backend already uses. `windows-core` is the 0.61 line `webview2-com`
# is built on: its `Interface::cast` is the only way to reach the newer `ICoreWebView2_*` interfaces.
webview2-com = "=0.38.2"
windows-core = "0.61"

