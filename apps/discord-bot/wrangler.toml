name = "deadlock-plus-discord-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "discord-bot.deadlockplus.app", custom_domain = true }]

# The website's namespace: the transparency page reads the cost list the bot writes.
[[kv_namespaces]]
binding = "TRANSPARENCY"
id = "144c79a974eb48abab31bad9c7f3b798"

[observability]
enabled = true

[vars]
POSTHOG_PROJECT_ID = "295233"
POSTHOG_HOST = "https://eu.i.posthog.com"

[triggers]
crons = ["0 * * * *"]
