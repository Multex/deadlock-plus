<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="64x64" />
        <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
        <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <!-- Link previews (Discord and others) use this as their accent colour and run no scripts, so they keep the brass. -->
        <meta name="theme-color" content="#e6b557" />
        <!-- theme-prepaint -->
        %sveltekit.head%
    </head>
    <body data-sveltekit-reload>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
