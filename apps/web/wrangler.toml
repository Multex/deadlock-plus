name = "deadlock-plus-web"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_als"]
workers_dev = false
routes = [
    { pattern = "deadlockplus.app", custom_domain = true },
    { pattern = "www.deadlockplus.app", custom_domain = true },
]

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[kv_namespaces]]
binding = "TRANSPARENCY"
id = "f91351f4f4dc4d2fa8c0d6236b26533f"

[vars]
POSTHOG_PROJECT_ID = "295233"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
