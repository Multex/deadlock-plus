[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/*/*"]

[workspace.package]
version = "0.14.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Pinned exact and matching: 0.21.14's optimizer has a genuine infinite loop repeatedly
# "transposing" the same EinSumMatMul nodes back and forth in this model's graph (confirmed via
# debug log: 400,000+ repeated patches and climbing, unbounded memory growth). 0.21.18 does not
# exhibit this. Left unpinned, Cargo also resolves tract-data ahead of the other tract-* crates,
# which is its own source of trouble — pin everything to the same version.
tract-onnx = "=0.21.18"
tract-data = "=0.21.18"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

# Unoptimized, decoding the game's shop art takes ~35 s in dev builds; optimizing the texture, PNG and archive
# crates brings it to ~5 s.
[profile.dev.package.source2]
opt-level = 3
[profile.dev.package.source2-texture]
opt-level = 3
[profile.dev.package.source2-resource]
opt-level = 3
[profile.dev.package.source2-vpk]
opt-level = 3
[profile.dev.package.source2-kv3]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.lz4_flex]
opt-level = 3
[profile.dev.package.ruzstd]
opt-level = 3
[profile.dev.package.zstd-rs]
opt-level = 3
