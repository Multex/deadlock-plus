name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The build jobs hold the update signing key, so they get no write access to the repo. The key is only in the
  # environment of the steps that sign; dependency install and tests never see it.
  build:
    runs-on: windows-latest
    env:
      # Code signing runs only once the SignPath project exists and this variable is set.
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      SENTRY_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install protoc
        shell: pwsh
        run: |
          $v = '36.0'
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '510FB2369A4720ADB457783768C5E1481A0E1137D9E7694478DFE9B8FE445DC1') { throw 'protoc checksum mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive $zip $dir
          "PROTOC=$dir\bin\protoc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PROTOC_INCLUDE=$dir\include" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - run: pnpm install --frozen-lockfile --filter "deadlock-plus..."
      - run: pnpm version:check
        working-directory: apps/desktop

      - name: Tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${version}"; exit 1; }

      - run: pnpm check
        working-directory: apps/desktop
      - run: pnpm test
        working-directory: apps/desktop

      - name: Build installer
        env:
          # `strip = true` makes the MSVC linker run with /DEBUG:NONE, so no PDB would exist to upload.
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          DP_POSTHOG_KEY: ${{ secrets.DP_POSTHOG_KEY }}
          DP_POSTHOG_HOST: ${{ secrets.DP_POSTHOG_HOST }}
          DP_SENTRY_DSN: ${{ secrets.DP_SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
        working-directory: apps/desktop

      - name: Upload debug files to Sentry
        if: env.SENTRY_UPLOAD == 'true'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: deadlock-plus
          SENTRY_PROJECT: deadlock-plus
        run: |
          npx --yes @sentry/cli@3.8.0 debug-files check target/release/deadlock-plus.exe
          npx --yes @sentry/cli@3.8.0 debug-files upload --wait \
            target/release/deadlock-plus.exe target/release/deadlock_plus.pdb

      - name: Upload unsigned installer
        if: env.SIGNPATH_ENABLED == 'true'
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-installer
          path: target/release/bundle/nsis/*-setup.exe

      - name: Sign installer with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: deadlock-plus
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # The updater signature covers the installer bytes, so it must be redone after Authenticode signing.
      - name: Replace installer and redo the updater signature
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          signed="$(find signed -name '*-setup.exe' | head -n 1)"
          [ -n "$signed" ] || { echo "SignPath returned no installer"; exit 1; }
          target="$(ls target/release/bundle/nsis/*-setup.exe)"
          cp "$signed" "$target"
          (cd apps/desktop && pnpm tauri signer sign "$OLDPWD/$target")

      - name: Prepare release files
        run: node scripts/release.mjs prepare windows

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: release-windows
          if-no-files-found: error

  # Linux bundles are unsigned for the OS. Only the updater signature is made, with the same key as Windows.
  build-linux:
    runs-on: ubuntu-22.04
    env:
      SENTRY_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf file protobuf-compiler libprotobuf-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
          key: linux-x64

      - run: pnpm install --frozen-lockfile --filter "deadlock-plus..."
      - run: pnpm version:check
        working-directory: apps/desktop

      - name: Tag matches package version
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${version}"; exit 1; }

      # Built against glibc 2.31 so it loads inside Steam's Debian 11 based runtime container. The runner's own
      # glibc is too new for that, so the layer cannot be built with plain cargo here.
      - name: Build Vulkan frame layer
        run: |
          pip install --user cargo-zigbuild ziglang
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/build-frames-layer.sh

      - name: Build binary
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          RUSTFLAGS: -C link-arg=-Wl,--build-id
          DP_POSTHOG_KEY: ${{ secrets.DP_POSTHOG_KEY }}
          DP_POSTHOG_HOST: ${{ secrets.DP_POSTHOG_HOST }}
          DP_SENTRY_DSN: ${{ secrets.DP_SENTRY_DSN }}
        run: pnpm tauri build --no-bundle
        working-directory: apps/desktop

      # Ships a stripped binary and keeps the debug info in a side file for Sentry.
      - name: Split debug info
        run: |
          bin=target/release/deadlock-plus
          objcopy --only-keep-debug "$bin" "$bin.debug"
          objcopy --strip-unneeded --add-gnu-debuglink="$bin.debug" "$bin"

      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri bundle
        working-directory: apps/desktop

      - name: Upload debug files to Sentry
        if: env.SENTRY_UPLOAD == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: deadlock-plus
          SENTRY_PROJECT: deadlock-plus
        run: |
          npx --yes @sentry/cli@3.8.0 debug-files upload --wait \
            target/release/deadlock-plus target/release/deadlock-plus.debug

      - name: Prepare release files
        run: node scripts/release.mjs prepare linux

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: release-linux
          if-no-files-found: error

  # Builds the updater feed from every platform's signature. It fails when a platform is missing, so a release never
  # ships an update that skips a platform.
  assemble:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-parts

      - name: Build updater feed
        env:
          REPOSITORY: ${{ github.repository }}
        run: node scripts/release.mjs manifest "${REPOSITORY}" release-parts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-out
          path: release-out
          if-no-files-found: error

  # Runs no project code: it only publishes what the other jobs produced.
  publish:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-out
          path: release-out

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${REPOSITORY}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-out/notes.md \
            release-out/Deadlock-Plus_*_x64-setup.exe \
            release-out/Deadlock-Plus_*_amd64.AppImage \
            release-out/Deadlock-Plus_*_amd64.deb \
            release-out/latest.json
