name: Release

# A `v1.2.0-beta.1` tag ships to the Beta update channel as a prerelease. Nightlies come from nightly.yml.
on:
  push:
    tags: ["v*", "!v*-nightly.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The build jobs hold the update signing key, so they get no write access to the repo. The key is only in the
  # environment of the steps that sign; dependency install and tests never see it.
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # Code signing runs only once the SignPath project exists and this variable is set.
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      SENTRY_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install protoc
        shell: pwsh
        run: |
          $v = '36.0'
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '510FB2369A4720ADB457783768C5E1481A0E1137D9E7694478DFE9B8FE445DC1') { throw 'protoc checksum mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive $zip $dir
          "PROTOC=$dir\bin\protoc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PROTOC_INCLUDE=$dir\include" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - run: pnpm install --frozen-lockfile --filter "deadlock-plus..."
      - run: pnpm version:check
        working-directory: apps/desktop

      - name: Tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${version}"; exit 1; }
          node scripts/release.mjs channel "${GITHUB_REF_NAME}"

      - run: pnpm check
        working-directory: apps/desktop
      - run: pnpm test
        working-directory: apps/desktop

      - name: Build installer
        env:
          # `strip = true` makes the MSVC linker run with /DEBUG:NONE, so no PDB would exist to upload.
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          DP_POSTHOG_KEY: ${{ secrets.DP_POSTHOG_KEY }}
          DP_POSTHOG_HOST: ${{ secrets.DP_POSTHOG_HOST }}
          DP_SENTRY_DSN: ${{ secrets.DP_SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
        working-directory: apps/desktop

      - name: Upload debug files to Sentry
        if: env.SENTRY_UPLOAD == 'true'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: deadlock-plus
          SENTRY_PROJECT: deadlock-plus
        run: |
          npx --yes @sentry/cli@3.8.0 debug-files check target/release/deadlock-plus.exe
          npx --yes @sentry/cli@3.8.0 debug-files upload --wait \
            target/release/deadlock-plus.exe target/release/deadlock_plus.pdb

      - name: Upload unsigned installer
        if: env.SIGNPATH_ENABLED == 'true'
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-installer
          path: target/release/bundle/nsis/*-setup.exe
          retention-days: 14

      - name: Sign installer with SignPath
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: deadlock-plus
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # The updater signature covers the installer bytes, so it must be redone after Authenticode signing.
      - name: Replace installer and redo the updater signature
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          signed="$(find signed -name '*-setup.exe' | head -n 1)"
          [ -n "$signed" ] || { echo "SignPath returned no installer"; exit 1; }
          target="$(ls target/release/bundle/nsis/*-setup.exe)"
          cp "$signed" "$target"
          (cd apps/desktop && pnpm tauri signer sign "$OLDPWD/$target")

      - name: Prepare release files
        run: node scripts/release.mjs prepare windows

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows
          path: release-windows
          if-no-files-found: error
          retention-days: 14

  # Linux bundles are unsigned for the OS. Only the updater signature is made, with the same key as Windows.
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SENTRY_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf file protobuf-compiler libprotobuf-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
          key: linux-x64

      - run: pnpm install --frozen-lockfile --filter "deadlock-plus..."
      - run: pnpm version:check
        working-directory: apps/desktop

      - name: Tag matches package version
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop/package.json version ${version}"; exit 1; }
          node scripts/release.mjs channel "${GITHUB_REF_NAME}"

      # Built against glibc 2.31 so it loads inside Steam's Debian 11 based runtime container. The runner's own
      # glibc is too new for that, so the layer cannot be built with plain cargo here.
      - name: Build Vulkan frame layer
        run: |
          pip install --user --require-hashes --only-binary=:all: -r .github/zigbuild-requirements.txt
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/build-frames-layer.sh

      - name: Build binary
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          RUSTFLAGS: -C link-arg=-Wl,--build-id
          DP_POSTHOG_KEY: ${{ secrets.DP_POSTHOG_KEY }}
          DP_POSTHOG_HOST: ${{ secrets.DP_POSTHOG_HOST }}
          DP_SENTRY_DSN: ${{ secrets.DP_SENTRY_DSN }}
        run: pnpm tauri build --no-bundle
        working-directory: apps/desktop

      # Ships a stripped binary and keeps the debug info in a side file for Sentry.
      - name: Split debug info
        run: |
          bin=target/release/deadlock-plus
          objcopy --only-keep-debug "$bin" "$bin.debug"
          objcopy --strip-unneeded --add-gnu-debuglink="$bin.debug" "$bin"

      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri bundle
        working-directory: apps/desktop

      - name: Upload debug files to Sentry
        if: env.SENTRY_UPLOAD == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: deadlock-plus
          SENTRY_PROJECT: deadlock-plus
        run: |
          npx --yes @sentry/cli@3.8.0 debug-files upload --wait \
            target/release/deadlock-plus target/release/deadlock-plus.debug

      - name: Prepare release files
        run: node scripts/release.mjs prepare linux

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux
          path: release-linux
          if-no-files-found: error
          retention-days: 14

  # Builds the updater feed from every platform's signature. It fails when a platform is missing, so a release never
  # ships an update that skips a platform.
  assemble:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      feed: ${{ steps.channel.outputs.feed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release-parts

      - name: Read the update channel
        id: channel
        run: node scripts/release.mjs channel "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build updater feed
        env:
          REPOSITORY: ${{ github.repository }}
        run: node scripts/release.mjs manifest "${REPOSITORY}" release-parts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-out
          path: release-out
          if-no-files-found: error
          retention-days: 14

  # Runs no project code: it only publishes what the other jobs produced.
  publish:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-out
          path: release-out

      - name: Draft release
        if: needs.assemble.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${REPOSITORY}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-out/notes.md \
            release-out/Deadlock-Plus_*_x64-setup.exe \
            release-out/Deadlock-Plus_*_amd64.AppImage \
            release-out/Deadlock-Plus_*_amd64.deb \
            release-out/latest.json

      # A prerelease ships at once: its channel's feed must point at assets users can download, and a draft's
      # assets are not public. GitHub's "latest" never picks a prerelease, so Release users never see it.
      - name: Publish prerelease and update its channel feed
        if: needs.assemble.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ needs.assemble.outputs.channel }}
          FEED: ${{ needs.assemble.outputs.feed }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${REPOSITORY}" \
            --prerelease \
            --latest=false \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-out/notes.md \
            release-out/Deadlock-Plus_*_x64-setup.exe \
            release-out/Deadlock-Plus_*_amd64.AppImage \
            release-out/Deadlock-Plus_*_amd64.deb \
            release-out/latest.json
          if ! gh release view "${FEED}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release create "${FEED}" \
              --repo "${REPOSITORY}" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}" \
              --title "${FEED}" \
              --notes "Holds latest.json for the ${CHANNEL} update channel. Not a build of its own."
          fi
          gh release upload "${FEED}" release-out/latest.json --repo "${REPOSITORY}" --clobber

  # Refreshes the translators' screenshots in Crowdin from this release's demo. It runs beside the build and nothing
  # waits on it, so it never makes a release slower, and a failure here never fails the release.
  crowdin-screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Check Crowdin secrets
        id: gate
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
        run: |
          if [ -n "$CROWDIN_PERSONAL_TOKEN" ] && [ -n "$CROWDIN_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Crowdin secrets are not set; skipping."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile --filter "deadlock-plus..."

      # The public game data the E2E job keeps. The capture drives the runner's own Chrome, so no browser download.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.gate.outputs.enabled == 'true'
        with:
          path: apps/desktop/e2e/.cache
          key: e2e-game-data-${{ hashFiles('apps/desktop/e2e/support/game-data.version') }}-
          restore-keys: e2e-game-data-${{ hashFiles('apps/desktop/e2e/support/game-data.version') }}-

      - name: Build the demo
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm demo:build
        working-directory: apps/desktop
        env:
          DEMO_LOG_LEVEL: error

      - name: Capture screenshots
        if: steps.gate.outputs.enabled == 'true'
        run: node e2e/support/crowdin-shots.mjs
        working-directory: apps/desktop

      - name: Upload to Crowdin
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/crowdin-screenshots.mjs
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
