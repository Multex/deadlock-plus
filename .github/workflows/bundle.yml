name: Bundle

on:
  workflow_dispatch:
  push:
    branches: [test/proton-game-builds]

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ""
            rust-targets: ""
            glob: |
              target/release/bundle/nsis/*-setup.exe
          - name: linux-x64
            os: ubuntu-latest
            args: ""
            rust-targets: ""
            glob: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf file protobuf-compiler libprotobuf-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install protoc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = '36.0'
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '510FB2369A4720ADB457783768C5E1481A0E1137D9E7694478DFE9B8FE445DC1') { throw 'protoc checksum mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive $zip $dir
          "PROTOC=$dir\bin\protoc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PROTOC_INCLUDE=$dir\include" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
          key: ${{ matrix.name }}

      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      # Built against glibc 2.31 so it loads inside Steam's Debian 11 based runtime container. The runner's own
      # glibc is too new for that, so the layer cannot be built with plain cargo here.
      - name: Build Vulkan frame layer
        if: runner.os == 'Linux'
        run: |
          pip install --user cargo-zigbuild ziglang
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/build-frames-layer.sh

      # Updater artifacts need the signing key, which this workflow never has.
      - name: Build bundles
        shell: bash
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' ${{ matrix.args }}
        working-directory: apps/desktop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
