name: Bundle

# Manual test build of the Linux installers, kept as workflow artifacts. It uses no secrets and publishes nothing.
# Tagged releases build and publish Linux through release.yml.
on:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
            glob: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf file protobuf-compiler libprotobuf-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
          key: ${{ matrix.name }}

      - run: pnpm install --frozen-lockfile --filter "deadlock-plus..."

      # Built against glibc 2.31 so it loads inside Steam's Debian 11 based runtime container. The runner's own
      # glibc is too new for that, so the layer cannot be built with plain cargo here.
      - name: Build Vulkan frame layer
        if: runner.os == 'Linux'
        run: |
          pip install --user --require-hashes --only-binary=:all: -r .github/zigbuild-requirements.txt
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/build-frames-layer.sh

      # Updater artifacts need the signing key, which this workflow never has.
      - name: Build bundles
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' ${{ matrix.args }}
        working-directory: apps/desktop

      - name: Check AppImage libraries
        run: bash scripts/check-appimage.sh target/release/bundle/appimage/*.AppImage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14

  appimage-startup:
    needs: bundle
    permissions:
      contents: read
    uses: ./.github/workflows/appimage-smoke.yml
    with:
      artifact: bundle-linux-x64
