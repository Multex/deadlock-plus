name: Announce release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to announce again
        required: true

permissions: {}

jobs:
  announce:
    if: ${{ !github.event.release.prerelease && (github.event_name == 'release' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Discord webhook
        id: gate
        env:
          WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DISCORD_UPDATES_WEBHOOK is not set; skipping."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/discord-updates
            packages/discord-messages

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24

      - name: Post to Discord
        if: steps.gate.outputs.enabled == 'true'
        env:
          DISCORD_UPDATES_WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            release="$(gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,url,body)"
            RELEASE_TAG="$(jq -r .tagName <<<"$release")"
            RELEASE_URL="$(jq -r .url <<<"$release")"
            RELEASE_BODY="$(jq -r .body <<<"$release")"
            export RELEASE_TAG RELEASE_URL RELEASE_BODY
          fi
          node apps/discord-updates/announce.mjs
