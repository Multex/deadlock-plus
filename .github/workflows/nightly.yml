name: Nightly

# Builds `main` for the Nightly update channel once a day, as a prerelease whose `latest.json` replaces the one on the
# rolling `nightly-feed` release. Windows only: Linux users on Nightly follow the Beta and Release feeds.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when main has not changed since the last nightly
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    if: github.repository == 'deadlock-plus/deadlock-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prune: ${{ steps.plan.outputs.prune }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          # The version and the "anything new?" check read every earlier beta and nightly tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Plan the nightly
        id: plan
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "${FORCE}" = "true" ]; then args+=(--force); fi
          node scripts/nightly.mjs plan "${args[@]}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Holds the update signing key, so it gets no write access to the repo, as in release.yml.
  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SENTRY_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Install protoc
        shell: pwsh
        run: |
          $v = '36.0'
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '510FB2369A4720ADB457783768C5E1481A0E1137D9E7694478DFE9B8FE445DC1') { throw 'protoc checksum mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive $zip $dir
          "PROTOC=$dir\bin\protoc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PROTOC_INCLUDE=$dir\include" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - run: pnpm install --frozen-lockfile --filter "deadlock-plus..."

      - name: Stamp the nightly version
        shell: bash
        run: |
          node scripts/nightly.mjs set-version "${VERSION}"
          (cd apps/desktop && pnpm version:sync)

      - name: Build installer
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          DP_POSTHOG_KEY: ${{ secrets.DP_POSTHOG_KEY }}
          DP_POSTHOG_HOST: ${{ secrets.DP_POSTHOG_HOST }}
          DP_SENTRY_DSN: ${{ secrets.DP_SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build
        working-directory: apps/desktop

      - name: Upload debug files to Sentry
        if: env.SENTRY_UPLOAD == 'true'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: deadlock-plus
          SENTRY_PROJECT: deadlock-plus
        run: |
          npx --yes @sentry/cli@3.8.0 debug-files check target/release/deadlock-plus.exe
          npx --yes @sentry/cli@3.8.0 debug-files upload --wait \
            target/release/deadlock-plus.exe target/release/deadlock_plus.pdb

      - name: Prepare release files
        run: node scripts/release.mjs prepare windows

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-windows
          path: release-windows
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # A lone artifact unpacks straight into path, and manifest reads one subfolder per artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-windows
          path: release-parts/release-windows

      - name: Build updater feed
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/nightly.mjs set-version "${VERSION}"
          node scripts/release.mjs manifest "${REPOSITORY}" release-parts windows

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-out
          path: release-out
          if-no-files-found: error
          retention-days: 7

  # Runs no project code: it publishes what the other jobs produced and deletes the nightlies the plan named.
  publish:
    needs: [plan, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-out
          path: release-out

      - name: Publish nightly and update the nightly feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          gh release create "${TAG}" \
            --repo "${REPOSITORY}" \
            --target "${SHA}" \
            --prerelease \
            --latest=false \
            --title "${TAG}" \
            --notes-file release-out/notes.md \
            release-out/Deadlock-Plus_*_x64-setup.exe \
            release-out/latest.json
          if ! gh release view nightly-feed --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release create nightly-feed \
              --repo "${REPOSITORY}" \
              --prerelease \
              --latest=false \
              --target "${SHA}" \
              --title nightly-feed \
              --notes "Holds latest.json for the nightly update channel. Not a build of its own."
          fi
          gh release upload nightly-feed release-out/latest.json --repo "${REPOSITORY}" --clobber

      # Only after the new nightly is out, so a failed build never leaves fewer nightlies than intended.
      - name: Delete old nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PRUNE: ${{ needs.plan.outputs.prune }}
        run: |
          read -ra tags <<< "${PRUNE}"
          for tag in "${tags[@]}"; do
            gh release delete "${tag}" --repo "${REPOSITORY}" --cleanup-tag --yes
          done
