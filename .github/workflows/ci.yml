name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf protobuf-compiler libprotobuf-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Install protoc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = '36.0'
          $zip = Join-Path $env:RUNNER_TEMP 'protoc.zip'
          Invoke-WebRequest "https://github.com/protocolbuffers/protobuf/releases/download/v$v/protoc-$v-win64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '510FB2369A4720ADB457783768C5E1481A0E1137D9E7694478DFE9B8FE445DC1') { throw 'protoc checksum mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'protoc'
          Expand-Archive $zip $dir
          "PROTOC=$dir\bin\protoc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PROTOC_INCLUDE=$dir\include" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - run: pnpm install --frozen-lockfile --filter "deadlock-plus..."
      - run: pnpm version:check
        working-directory: apps/desktop
      - run: pnpm tiers:check
        working-directory: apps/desktop
      - run: pnpm layers:check
        working-directory: apps/desktop
      - run: pnpm i18n:check
        working-directory: apps/desktop
      - run: pnpm format:check
        working-directory: apps/desktop
      - run: pnpm check
        working-directory: apps/desktop
      - run: pnpm test
        working-directory: apps/desktop
      # The Tauri crate embeds the built frontend at compile time, so clippy and tests need it.
      - run: pnpm build
        working-directory: apps/desktop
      - run: pnpm build:no-demo
        working-directory: apps/desktop

      - name: Format
        if: runner.os == 'Windows'
        run: cargo fmt --all --check -- --config max_width=120,use_small_heuristics=Max
      - run: cargo clippy --workspace --lib --tests -- -D warnings
      - name: Clippy the privileged helper exe
        if: runner.os == 'Windows'
        run: cargo clippy -p deadlock-plus --bins --features privileged-helper -- -D warnings
      - run: cargo test --workspace --lib

      - name: Build Vulkan frame layer
        if: runner.os == 'Linux'
        run: cargo build -p dp-frames-layer --release

      - name: Generated types are current
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git diff --exit-code -- packages/ipc-types/src
          test -z "$(git ls-files --others --exclude-standard -- packages/ipc-types/src)"

  # Compiles every crate below the app for a target the runner is not (or not only) building natively. The app crate is
  # excluded: it needs the target's webview libraries, and the native jobs above already build it.
  cross-check:
    name: cross-check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install musl C toolchain and protoc
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      - name: Check crates
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo check --workspace --exclude deadlock-plus --lib --tests --target ${{ matrix.target }}

  # Drives the frontend in the runner's own Chrome against the in-memory demo backend. The screenshot
  # comparisons skip themselves here: their baselines are made on Windows.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --filter "deadlock-plus..."
      - run: pnpm e2e:unit
        working-directory: apps/desktop

      # Public game data the tests download once. Bump e2e/support/game-data.version to start cold.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/desktop/e2e/.cache
          key: e2e-game-data-${{ hashFiles('apps/desktop/e2e/support/game-data.version') }}-
          restore-keys: e2e-game-data-${{ hashFiles('apps/desktop/e2e/support/game-data.version') }}-

      - run: pnpm e2e
        working-directory: apps/desktop
      # Reads the demo build `pnpm e2e` just made; budgets live in perf/budgets.json.
      - run: pnpm bundle:check
        working-directory: apps/desktop

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: apps/desktop/e2e/.cache
          key: e2e-game-data-${{ hashFiles('apps/desktop/e2e/support/game-data.version') }}-${{ hashFiles('apps/desktop/e2e/.cache/**/*.entry') }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

  crowdin-relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --filter "crowdin-relay..."
      - run: pnpm typecheck
        working-directory: apps/crowdin-relay
      - run: pnpm test
        working-directory: apps/crowdin-relay
      - run: pnpm format:check
        working-directory: apps/crowdin-relay
      - run: pnpm exec prettier --check "../../packages/discord-messages/**/*.{ts,js}"
        working-directory: apps/crowdin-relay

  discord-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --filter "discord-bot..."
      - run: pnpm typecheck
        working-directory: apps/discord-bot
      - run: pnpm test
        working-directory: apps/discord-bot
      - run: pnpm format:check
        working-directory: apps/discord-bot

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --filter "deadlock-plus-web..."
      - run: pnpm check
        working-directory: apps/web
      - run: pnpm test
        working-directory: apps/web
      - run: pnpm format:check
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      # The bundle budgets read the build output, so they skip in the test run above.
      - run: pnpm exec vitest run src/lib/perf.test.ts
        working-directory: apps/web

  discord-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - run: node --test
        working-directory: apps/discord-updates
      - run: node --test
        working-directory: packages/discord-messages

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
