name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

# A newer push cancels a pull request's stale run. Every main commit keeps its own run, so each merge gets a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --filter "deadlock-plus..."
      - run: pnpm e2e:unit
        working-directory: apps/desktop

      # Public game data the tests download once. Bump e2e/support/game-data.version to start cold.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/desktop/e2e/.cache
          key: e2e-game-data-${{ hashFiles('apps/desktop/e2e/support/game-data.version') }}-
          restore-keys: e2e-game-data-${{ hashFiles('apps/desktop/e2e/support/game-data.version') }}-

      - run: pnpm exec playwright install --with-deps chromium webkit
        working-directory: apps/desktop
      - run: pnpm exec playwright test --config playwright.dispatch.config.ts
        working-directory: apps/desktop

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: apps/desktop/e2e/.cache
          key: e2e-game-data-${{ hashFiles('apps/desktop/e2e/support/game-data.version') }}-${{ hashFiles('apps/desktop/e2e/.cache/**/*.entry') }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          retention-days: 7

